name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      # No .env and no LLM key on purpose: tests must be hermetic.
      - run: python -m pytest
  webapp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: webapp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: webapp/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:dom
      - run: npm run build
